# data_module of the baseline for the rebuilt Al data. Plan:
# see the experiment description.
# Generated by: workspace/experiments/data_rebuild/scripts/stage_e_write_configs.py
# Copied from: data_module/scm_al_baseline_dedup.yaml (not edited). Only the cache path and the value of average_density are replaced:
#   root_dir: MN/datasets/cache/scm_al_baseline/{train,val,test}
#     Made by: build_tilt_baseline_csv.py (CSV. MN/datasets/csv/scm_al_baseline/)
#           -> sbatch_prep_cache_baseline.sh (cached with mattergen.scripts.csv_to_dataset. The old cache is not overwritten)
#     The row sets of train/val/test are train/val/test of split.json (the same as proposed. test is not used for training).
#   average_density: the value of the card 0.05839622542107227 (card 71ad68c125fe, recomputed from the 4,419 train rows. Not referenced in training).
# The conditioning property gb_gamma_J_m2, transforms, dataset_transforms and batch_size are the same as the older baseline.
_target_: mattergen.common.data.datamodule.CrystDataModule
_recursive_: true
properties:
  - "gb_gamma_J_m2"

site_properties: []

transforms:
- _target_: mattergen.common.data.transform.symmetrize_lattice
  _partial_: true
- _target_: mattergen.common.data.transform.set_chemical_system_string
  _partial_: true

dataset_transforms:
  - _target_: mattergen.common.data.dataset_transform.filter_sparse_properties
    _partial_: true

average_density: 0.05839622542107227  # Value of the card (see the header). Not referenced in training.
root_dir: ${oc.env:PROJECT_ROOT}/../datasets/cache/scm_al_baseline

train_dataset:
  _target_: mattergen.common.data.dataset.CrystalDataset.from_cache_path
  cache_path: ${data_module.root_dir}/train
  properties: ${data_module.properties}
  site_properties: ${data_module.site_properties}
  transforms: ${data_module.transforms}
  dataset_transforms: ${data_module.dataset_transforms}

val_dataset:
  _target_: mattergen.common.data.dataset.CrystalDataset.from_cache_path
  cache_path: ${data_module.root_dir}/val
  properties: ${data_module.properties}
  site_properties: ${data_module.site_properties}
  transforms: ${data_module.transforms}
  dataset_transforms: ${data_module.dataset_transforms}

test_dataset:
  _target_: mattergen.common.data.dataset.CrystalDataset.from_cache_path
  cache_path: ${data_module.root_dir}/test
  properties: ${data_module.properties}
  site_properties: ${data_module.site_properties}
  transforms: ${data_module.transforms}
  dataset_transforms: ${data_module.dataset_transforms}

num_workers:
  train: 4
  val: 2
  test: 2

batch_size:
  train: 4
  val: 4
  test: 4

max_epochs: 200
