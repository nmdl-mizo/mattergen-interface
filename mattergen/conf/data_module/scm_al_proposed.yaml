# data_module of the proposed (symmetry-constrained, variable length, no padding) for the rebuilt Al data. Plan:
# see the experiment description.
# Generated by: workspace/experiments/data_rebuild/scripts/stage_e_write_configs.py
# Copied from: data_module/scm_al_proposed.yaml (not edited). Only the inputs are replaced:
#   gamma_csv_path = gamma_dedup.csv, split_indices_json_path = split.json (train / val. test is not used for training),
#   bulk_membership_csv_path = bulk_membership.csv, manifest_dir = manifests/ ({cnid}.json. 31 templates),
#   average_density = 0.05839622542107227 (the value of the card 71ad68c125fe, recomputed from the 4,419 train rows. Not referenced in training for proposed).
# Paths are from the viewpoint of the compute node (<CLUSTER_MOUNT>/...). expected_size is not set (load_split_indices checks that the counts agree with n_train/n_val of the JSON and len).
# Environment variables: export SCM_HOST_Z=13 and SCM_SOLUTE_ZS= (empty) before training.
_target_: mattergen.common.data.datamodule.CrystDataModule
_recursive_: true
average_density: 0.05839622542107227
max_epochs: ${trainer.max_epochs}

train_dataset:
  _target_: mattergen.symmetry_constrained.variable_length.dataset.SymmetricTiltGBDataset
  gamma_csv_path: ${oc.env:GBREL_DATA}/training/gamma_dedup.csv
  bulk_membership_csv_path: ${oc.env:GBREL_DATA}/training/bulk_membership.csv
  manifest_dir: ${oc.env:GBREL_DATA}/training/manifests
  split_indices_json_path: ${oc.env:GBREL_DATA}/training/split.json
  split: train

val_dataset:
  _target_: mattergen.symmetry_constrained.variable_length.dataset.SymmetricTiltGBDataset
  gamma_csv_path: ${oc.env:GBREL_DATA}/training/gamma_dedup.csv
  bulk_membership_csv_path: ${oc.env:GBREL_DATA}/training/bulk_membership.csv
  manifest_dir: ${oc.env:GBREL_DATA}/training/manifests
  split_indices_json_path: ${oc.env:GBREL_DATA}/training/split.json
  split: val

num_workers:
  train: 4
  val: 2

batch_size:
  train: 4
  val: 4
