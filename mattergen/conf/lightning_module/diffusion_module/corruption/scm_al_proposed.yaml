# Corruption config of the proposed for the rebuilt Al data. Plan: see the experiment description.
# Generated by: workspace/experiments/data_rebuild/scripts/stage_e_write_configs.py
# Copied from: corruption/scm_al_proposed.yaml (not edited). Only the GBTranslationVPSDE statistics (mu_uncond / sigma2) of gb_dx are replaced:
#   computed by stage_e_stats.py from the train rows of gamma_dedup.csv (n_rows=4419) (results/dxvpsde_stats.json).
#   mu_uncond = mean(dx_A), sigma2 = population variance (ddof=0).
# dim of D3PM is 101 (the original MatterGen default. Not 102 for padding).
_target_: mattergen.diffusion.corruption.multi_corruption.MultiCorruption
sdes:
  pos:
    _target_: mattergen.common.diffusion.corruption.NumAtomsVarianceAdjustedWrappedVESDE
    wrapping_boundary: 1.0
    sigma_max: 5.0
    limit_info_key: num_atoms

  gb_t:
    _target_: mattergen.diffusion.wrapped.wrapped_sde.WrappedVESDE
    wrapping_boundary: 1.0
    sigma_min: 0.01
    sigma_max: 5.0

  gb_dx:
    _target_: mattergen.symmetry_constrained.corruption_dx.GBTranslationVPSDE
    beta_min: 0.1
    beta_max: 20
    mu_uncond: -0.04579090291921249
    sigma2: 0.18528099361717523

discrete_corruptions:
  atomic_numbers:
    _target_: mattergen.diffusion.corruption.d3pm_corruption.D3PMCorruption
    offset: 1
    d3pm:
      _target_: mattergen.diffusion.d3pm.d3pm.MaskDiffusion
      dim: 101
      schedule:
        _target_: mattergen.diffusion.d3pm.d3pm.create_discrete_diffusion_schedule
        kind: standard
        num_steps: 1000
