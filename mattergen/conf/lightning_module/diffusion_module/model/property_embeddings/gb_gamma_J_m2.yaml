# M-t4b (internal notes): property
# embedding config for the symmetry_constrained gamma scalar condition. name: is the string value of
# mattergen.symmetry_constrained.layout.GB_GAMMA_PROPERTY_KEY ("gb_gamma_J_m2") -- kept as a literal here
# because Hydra yaml cannot import a Python constant; SS3.1 step 4's startup assert (to be wired
# where this config is consumed) is the machine guard against this literal drifting from
# GB_GAMMA_PROPERTY_KEY. Otherwise identical in shape to energy_above_hull.yaml /
# surface_energy_J_m2.yaml (the other fields follow energy_above_hull.yaml).
_target_: mattergen.property_embeddings.PropertyEmbedding
name: gb_gamma_J_m2
unconditional_embedding_module:
  _target_: mattergen.property_embeddings.EmbeddingVector
  hidden_dim: ${lightning_module.diffusion_module.model.hidden_dim}
conditional_embedding_module:
  _target_: mattergen.diffusion.model_utils.NoiseLevelEncoding
  d_model: ${lightning_module.diffusion_module.model.hidden_dim}
scaler:
  _target_: mattergen.common.utils.data_utils.StandardScalerTorch
