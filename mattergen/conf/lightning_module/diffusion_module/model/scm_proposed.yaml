# model config of the proposed (symmetry-constrained, variable length) for the other system. Plan:
# internal notes。
# Based on the structure of model/scm_cond.yaml (Al proposed, not edited), with:
#   - _target_: mattergen.symmetry_constrained.variable_length.adapter.SymmetryConstrainedAdapter (the variable-length
#     adapter. gb_t_readout has no fixed N_PAD reshape)
#   - the configuration of the original MatterGen default as the starting point (the atom-type vocabulary is only the real elements + MASK) is used. The keys for the extension switches
#     that existed in the pre-release version are not written (they do not exist in the code of the release version either. An older setting with the value false
#     is accepted by the compatibility layer)
# Everything else (the gemnet structure, hidden_dim, crystal_condition_on_adapt, etc.) is the same as in the Al proposed
# (what is inherited is the mathematics of the symmetry).
_target_: mattergen.symmetry_constrained.variable_length.adapter.SymmetryConstrainedAdapter
hidden_dim: 512
zero_condition_embeddings: false
gemnet:
  _target_: mattergen.common.gemnet.gemnet_ctrl.GemNetTCtrl
  crystal_condition_on_adapt: [gb_gamma_J_m2]
  site_condition_on_adapt: []
  num_targets: 1
  latent_dim: ${eval:'${..hidden_dim} * (1 + len(${..property_embeddings}))'}
  atom_embedding:
    _target_: mattergen.common.gemnet.layers.embedding_block.AtomEmbedding
    emb_size: ${...hidden_dim}
    with_mask_type: ${eval:'${...denoise_atom_types} and "${...atom_type_diffusion}" == "mask"'}
  emb_size_atom: ${..hidden_dim}
  emb_size_edge: ${..hidden_dim}
  max_neighbors: 50
  max_cell_images_per_dim: 5
  cutoff: 7.
  num_blocks: 4
  regress_stress: true
  otf_graph: true
  scale_file: ${oc.env:PROJECT_ROOT}/common/gemnet/gemnet-dT.json
denoise_atom_types: true
atom_type_diffusion: mask
property_embeddings: {}
property_embeddings_adapt: {}
site_property_embeddings: {}
site_property_embeddings_adapt: {}
defaults:
  - property_embeddings@property_embeddings_adapt.gb_gamma_J_m2: gb_gamma_J_m2
